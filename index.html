<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/brand/icon.png" />

    <!-- ── installable PWA ─────────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      `theme_color` and `background_color` are two different decisions and the
      manifest is a strict-JSON file with nowhere to say so, so the reasoning
      lives here.

      theme-color paints *chrome*: the Android status bar, a desktop PWA's
      title bar. Brand violet (#41009a, the --signal token) is the app's
      identity and is what should frame it.

      background_color paints the *splash* Chromium generates from the
      manifest before the first frame, so it has to equal the app's real page
      background — --ground, #fcfbfe. Violet there would flash the whole
      screen the wrong colour and hand over to a near-white page, which reads
      as a bug. Deliberately tied to --ground, and pinned: the manifest test
      parses both values out of src/styles/tokens.css, so moving the palette
      fails a test rather than shipping a flash.
    -->
    <meta name="theme-color" content="#41009a" />
    <!--
      Both spellings, on purpose. `mobile-web-app-capable` is the standard one
      (Chromium, and Safari from 17); `apple-mobile-web-app-capable` is the
      older Apple-only name and is still the only one iOS 16 and earlier
      understands. Drop it and those iPhones open Sonare as a Safari tab with
      an address bar instead of standalone. Chrome logs a deprecation notice
      for the Apple spelling — a console notice is cheaper than losing
      standalone mode on the older half of iOS.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `default` keeps the iOS status bar dark-on-light, which is what reads
      over --ground. `black-translucent` would slide the app under the status
      bar, and `viewport-fit=cover` is already set above — the header would
      land behind the notch.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sonare" />
    <!-- iOS ignores the manifest's icon list. Same 512x512 artwork; iOS
         downscales it for the home screen. -->
    <link rel="apple-touch-icon" href="/brand/icon.png" />
    <!--
      ── the iOS splash ───────────────────────────────────────────────────

      Safari ignores the manifest for splash purposes and wants one <link> per
      device resolution, each with its own `media` query. The artwork is the
      design handoff's export (docs/design/README.md §7, and the
      size-to-device table in the handoff's assets/splash/README.md).

      Five resolutions, chosen rather than exhaustive. Apple's full matrix runs
      to thirty-odd entries once every iPad and every retired iPhone is in it,
      and a list that long is one nobody audits — half its files go missing and
      nothing says so. A device that matches no query here gets the browser's
      default splash, which is why the ground colour matters more than the
      list being complete: the images are drawn on #fcfbfe, the --ground token
      and the manifest's background_color, so the default and the designed
      splash hand over to the first paint at the same colour.

      Each `media` query is the device's own CSS size and pixel ratio, and the
      product of the two is the file's real pixel size — 430 x 3 = 1290,
      932 x 3 = 2796. scripts/pwa-manifest.test.ts multiplies it out against
      the PNG's IHDR chunk, so a link paired with the wrong file fails rather
      than shipping a stretched splash.

      Ordered widest first, which is only for reading: `media` selects, so
      order carries no meaning to Safari.
    -->
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash/apple-splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..800&family=Noto+Sans+Devanagari:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Lingotran — Sonare speech activity</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
