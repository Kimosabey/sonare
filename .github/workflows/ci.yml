name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # No live Azure/Mongo credentials in CI — verify.mjs is static analysis
      # only (grep-shaped rule checks), it never calls either service.
      - run: npm run verify

      # Also credential-free: recorder.ts tests feed synthetic dBFS sequences
      # into the endpointer directly, and azureSpeech.ts tests build hand-made
      # response shapes rather than calling Azure.
      - run: npm run test

      # Last, because it is the slowest and the others localise a failure
      # better — but not optional. typecheck, lint and test all passed on a
      # change whose bundle failed outright ("manualChunks is not a function",
      # Vite 8 requiring the function form), so without this a broken
      # production build merges clean. Also typechecks the server build, which
      # `tsconfig.json` alone does not cover.
      - run: npm run build
